name: Windows build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      FOOTBALL_DATA_API_KEY: ""
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install development and packaging dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev,build]"
      - name: Lint
        run: python -m ruff check .
      - name: Test API, models, caches, settings, catalog, and Korean names
        timeout-minutes: 2
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -u -m pytest -v --timeout=30 --timeout-method=thread --ignore=tests/test_app.py --ignore=tests/test_logos.py --ignore=tests/test_ui.py --ignore=tests/test_favorites.py --ignore=tests/test_personalization.py --ignore=tests/test_notifications.py
      - name: Smoke check source GUI
        timeout-minutes: 2
        run: python scripts/smoke_app.py
      - name: Test GUI startup and shutdown
        timeout-minutes: 2
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -u -m pytest tests/test_app.py -v --timeout=30 --timeout-method=thread
      - name: Test crest decoding and offline image cache
        timeout-minutes: 2
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -u -m pytest tests/test_logos.py -v --timeout=30 --timeout-method=thread
      - name: Test calendar, favorites, personalization, and reminders
        timeout-minutes: 2
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -u -m pytest tests/test_ui.py tests/test_favorites.py tests/test_personalization.py tests/test_notifications.py -v --timeout=30 --timeout-method=thread
      - name: Build a key-free Windows executable
        shell: pwsh
        run: |
          Remove-Item Env:FOOTBALL_DATA_API_KEY -ErrorAction SilentlyContinue
          python -m PyInstaller --clean --noconfirm kickoff-desk.spec
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller build failed." }
      - name: Smoke check Windows executable
        shell: pwsh
        run: |
          Remove-Item Env:FOOTBALL_DATA_API_KEY -ErrorAction SilentlyContinue
          $smokeData = Join-Path $env:RUNNER_TEMP ([guid]::NewGuid().ToString())
          New-Item -ItemType Directory -Path $smokeData | Out-Null
          $env:LOCALAPPDATA = $smokeData
          try {
            $app = Start-Process -FilePath (Resolve-Path "dist/KickoffDesk.exe") `
              -ArgumentList "--mock", "--smoke-test" -PassThru
            $null = $app.Handle
            if (-not $app.WaitForExit(30000)) {
              taskkill /PID $app.Id /T /F | Out-Null
              throw "Packaged GUI smoke check timed out."
            }
            if ($app.ExitCode -ne 0) {
              throw "Packaged GUI smoke check failed: exit code $($app.ExitCode)."
            }
          } finally {
            Remove-Item -Recurse -Force $smokeData -ErrorAction SilentlyContinue
          }
      - name: Upload Windows application
        uses: actions/upload-artifact@v4
        with:
          name: KickoffDesk-windows-x64
          path: dist/KickoffDesk.exe
          if-no-files-found: error
          retention-days: 14
