[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "kickoff-desk"
version = "0.1.1"
description = "A native desktop football fixture calendar in Korean Standard Time"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.8,<7",
    "requests>=2.32.3,<3",
    "tzdata>=2025.1",
    "keyring>=25.5,<26; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "pytest-qt>=4.4,<5", "pytest-timeout>=2.3,<3", "ruff>=0.11,<1"]
build = ["pyinstaller>=6.12,<7"]

[project.gui-scripts]
kickoff-desk = "kickoff_desk.app:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kickoff_desk = [
    "assets/crests/5.png",
    "assets/crests/57.png",
    "assets/crests/65.png",
    "assets/crests/73.png",
    "assets/crests/81.png",
    "assets/crests/86.png",
    "assets/crests/SOURCES.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
qt_api = "pyside6"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
